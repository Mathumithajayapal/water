<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PureWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: '#ea580c', // PureWave Orange
            primaryHover: '#c2410c', // Darker Orange
            darkBg: '#0f0f0f',
            darkHeader: '#1a1a1a',
            // Mapped colors for the template structure
            accent: '#ea580c', 
            'brand-dark': '#0F172A', 
            'brand-light': '#F8FAFC', 
            'brand-muted': '#64748B'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeInUp 0.8s ease-out;
    }
    
    [dir="rtl"] { direction: rtl; }

    /* Ensure no horizontal scroll */
    html, body {
      overflow-x: hidden;
      width: 100%;
    }
  </style>
</head>
<body class="font-sans antialiased bg-gray-50 dark:bg-darkBg h-screen overflow-hidden flex flex-col transition-colors duration-300 relative">

  <!-- Background Animated Blobs -->
  <div class="absolute top-20 start-10 w-72 h-72 bg-primary/10 rounded-full blur-3xl animate-pulse pointer-events-none"></div>
  <div class="absolute bottom-20 end-10 w-96 h-96 bg-brand-muted/20 dark:bg-white/5 rounded-full blur-3xl animate-pulse pointer-events-none" style="animation-delay: 1.5s;"></div>

  <!-- Theme & RTL Toggles (Moved to Top Right) -->
  <div class="absolute top-4 end-4 sm:top-6 sm:end-8 z-50 flex items-center gap-4">
    <button id="theme-toggle" class="relative w-[72px] h-[34px] flex items-center bg-gray-200 dark:bg-[#1E293B] rounded-full p-1 transition-colors duration-300 focus:outline-none border border-gray-300 dark:border-gray-700 overflow-hidden" title="Toggle Theme">
      <span class="text-[9px] font-medium text-gray-500 absolute end-2.5 dark:opacity-0 transition-opacity duration-300 tracking-wider">LIGHT</span>
      <span class="text-[9px] font-medium text-primary absolute start-2.5 opacity-0 dark:opacity-100 transition-opacity duration-300 tracking-wider">DARK</span>
      
      <div class="w-[24px] h-[24px] bg-white dark:bg-darkBg border border-gray-200 dark:border-gray-600 rounded-full shadow-sm transform transition-transform duration-300 flex items-center justify-center rtl:dark:-translate-x-[38px] ltr:dark:translate-x-[38px] dark:translate-x-[38px] z-10">
        <i class="fas fa-sun text-[11px] text-primary dark:hidden block"></i>
        <i class="fas fa-moon text-[11px] text-primary hidden dark:block"></i>
      </div>
    </button>
    
    <button id="rtl-toggle" class="text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors duration-300" title="Toggle RTL">
      RTL
    </button>
  </div>

  <div class="flex-1 overflow-y-auto flex flex-col justify-center items-center p-4">
    
    <!-- Main Login Card -->
    <div class="w-full max-w-sm bg-white dark:bg-darkHeader shadow-2xl p-6 md:p-8 border border-gray-200 dark:border-gray-800 relative z-10 animate-fade-in group rounded-2xl">
        
        <!-- Top Gradient Border -->
        <div class="absolute top-0 start-0 w-full h-1 bg-gradient-to-r from-primary to-transparent rounded-t-2xl"></div>

        <!-- Header / Logo -->
        <div class="text-center mb-6">
          <!-- UPDATED: flex-row instead of flex-col to place icon and text on the same line -->
          <a href="index.html" class="inline-flex flex-row items-center justify-center gap-3 no-underline mb-4">
            <!-- Exact PureWave Logo -->
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shrink-0">
              <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" class="w-7 h-7">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21.5C17.2467 21.5 21.5 17.2467 21.5 12C21.5 8 12 2 12 2C12 2 2.5 8 2.5 12C2.5 17.2467 6.75329 21.5 12 21.5Z" />
              </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-brand-dark dark:text-white uppercase">Pure<span class="text-primary">Wave</span></h1>
          </a>
          <h2 class="text-xl font-semibold text-brand-dark dark:text-gray-200 uppercase tracking-tight mb-2">Welcome Back.</h2>
          <p class="text-[10px] uppercase tracking-[0.2em] font-medium text-brand-muted">Sign in to access your dashboard</p>
        </div>

        <!-- Login Form -->
        <form class="flex flex-col gap-4" onsubmit="handleLogin(event)">

          <!-- Email Input -->
          <div>
              <label class="block text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-gray-300 mb-2">
                Email Address
              </label>
              <input 
                type="email" 
                required
                placeholder="YOUR.EMAIL@EXAMPLE.COM"
                class="w-full px-3 py-3 bg-transparent border border-gray-300 dark:border-gray-700 text-brand-dark dark:text-white text-xs uppercase tracking-widest focus:outline-none focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary rounded-md transition-all"
              />
          </div>

          <!-- Password Input -->
          <div>
              <label class="block text-[10px] font-medium uppercase tracking-widest text-brand-dark dark:text-gray-300 mb-2">
                Password
              </label>
              <div class="relative">
                <input 
                    type="password" 
                    id="password"
                    required
                    placeholder="ENTER YOUR PASSWORD"
                    class="w-full px-3 py-3 bg-transparent border border-gray-300 dark:border-gray-700 text-brand-dark dark:text-white text-xs uppercase tracking-widest focus:outline-none focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary rounded-md transition-all"
                />
                <button 
                    type="button" 
                    onclick="togglePassword()"
                    class="absolute end-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors"
                >
                    <i class="fas fa-eye text-sm" id="toggleIcon"></i>
                </button>
              </div>
          </div>

          <!-- Form Options -->
          <div class="flex items-center justify-between text-[10px] sm:text-xs pt-1">
              <label class="flex items-center cursor-pointer group-checkbox">
                <input type="checkbox" class="w-3 h-3 sm:w-4 sm:h-4 rounded border-gray-300 text-primary focus:ring-primary bg-transparent">
                <span class="ms-2 text-brand-muted font-medium uppercase tracking-widest">Remember me</span>
              </label>
              <span class="text-primary font-medium uppercase tracking-widest cursor-pointer hover:text-brand-dark dark:hover:text-white transition-colors">
                Forgot password?
              </span>
          </div>

          <!-- Submit Button -->
          <button 
              type="submit"
              class="w-full py-3 mt-4 bg-primary text-white hover:bg-primaryHover font-semibold uppercase tracking-widest text-xs transition-all duration-300 flex items-center justify-center gap-2 rounded-full shadow-lg shadow-primary/20"
          >
              <span>Sign In</span>
              <i class="fas fa-arrow-right text-[10px] rtl:rotate-180"></i>
          </button>

          <!-- Divider -->
          <div class="relative my-6">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
              </div>
              <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-medium">
                <span class="px-3 bg-white dark:bg-darkHeader text-brand-muted">Or Continue With</span>
              </div>
          </div>

          <!-- Social Logins -->
          <div class="flex flex-row items-center justify-center gap-4">
              <!-- Google -->
              <button 
                type="button" title="Sign in with Google"
                class="flex items-center justify-center w-12 h-12 border border-gray-300 dark:border-gray-700 hover:border-primary dark:hover:border-primary transition-colors bg-transparent rounded-full shadow-sm hover:shadow-md hover:-translate-y-1"
              >
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
              </button>

              <!-- Apple -->
              <button 
                type="button" title="Sign in with Apple"
                class="flex items-center justify-center w-12 h-12 border border-gray-300 dark:border-gray-700 hover:border-primary dark:hover:border-primary transition-colors bg-transparent rounded-full shadow-sm hover:shadow-md hover:-translate-y-1"
              >
                <i class="fab fa-apple text-xl text-brand-dark dark:text-gray-200"></i>
              </button>

              <!-- Facebook -->
              <button 
                type="button" title="Sign in with Facebook"
                class="flex items-center justify-center w-12 h-12 border border-gray-300 dark:border-gray-700 hover:border-primary dark:hover:border-primary transition-colors bg-transparent rounded-full shadow-sm hover:shadow-md hover:-translate-y-1"
              >
                <i class="fab fa-facebook text-blue-600 text-xl"></i>
              </button>
          </div>

        </form>

        <!-- Sign Up Link -->
        <div class="mt-8 text-center text-[10px] sm:text-xs font-medium uppercase tracking-widest text-brand-muted">
          No Account? 
          <a href="signup.html" class="text-brand-dark dark:text-white hover:text-primary transition-colors ms-1 border-b border-primary pb-0.5 font-semibold">
              Sign Up
          </a>
        </div>

    </div>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Handle Login Submit (Simulation)
    function handleLogin(event) {
      event.preventDefault();

      const button = event.target.querySelector('button[type="submit"]');
      const icon = button.querySelector('i');
      const span = button.querySelector('span');
      
      icon.className = 'fas fa-spinner fa-spin';
      span.innerText = 'AUTHENTICATING...';
      button.disabled = true;
      button.classList.add('opacity-50', 'cursor-not-allowed');

      // Simulate API call, then redirect to the PureWave User Dashboard
      setTimeout(() => {
        window.location.href = 'user.html';
      }, 1500);
    }

    // Theme Toggle Function
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    function toggleTheme() {
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        html.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      }
    }

    if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
    if (localStorage.getItem('theme') === 'dark') {
      html.classList.add('dark');
      html.classList.add('dark-mode');
    }

    // RTL Toggle Function
    const rtlToggle = document.getElementById('rtl-toggle');

    function toggleRTL() {
      if (html.getAttribute('dir') === 'rtl') {
        html.removeAttribute('dir');
        localStorage.setItem('direction', 'ltr');
      } else {
        html.setAttribute('dir', 'rtl');
        localStorage.setItem('direction', 'rtl');
      }
    }

    if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
    if (localStorage.getItem('direction') === 'rtl') html.setAttribute('dir', 'rtl');

  </script>

</body>
</html>
